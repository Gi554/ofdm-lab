name: Validation scientifique

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Vérifier la promotion vers main
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$BASE_BRANCH" = "main" ] && [ "$HEAD_BRANCH" != "staging" ]; then
            echo "Une PR vers main doit provenir de staging."
            exit 1
          fi

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installer le projet
        run: python -m pip install -e ".[dev]"
      - name: Tests scientifiques
        run: python -m pytest -q
      - name: Analyse statique
        run: python -m ruff check .
      - name: Formatage
        run: python -m ruff format --check .
      - name: Expériences reproductibles
        run: |
          python experiments/01_binary_generation.py
          python experiments/02_bpsk.py
          python experiments/03_qpsk.py
          python experiments/04_qam.py
          python experiments/05_awgn.py
          python experiments/06_ber_comparison.py
          python experiments/07_fft_ifft.py
      - name: Archiver les mesures
        uses: actions/upload-artifact@v4
        with:
          name: resultats-python-${{ matrix.python-version }}
          path: results/
