[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ofdm-lab"
version = "0.1.0"
description = "Laboratoire pédagogique de transmissions numériques en bande de base complexe"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "pandas>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "ipykernel>=6"]
app = ["streamlit>=1.35"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
